name: Discord Stock Analysis

on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: "分析する銘柄コード"
        required: false
        type: string

      channel_id:
        description: "結果を送るDiscordチャンネルID"
        required: true
        type: string

      mode:
        description: "analysis または ai_analysis"
        required: true
        default: "analysis"
        type: string

      portfolio_json:
        description: "保有株データ"
        required: false
        default: "[]"
        type: string

      realized_profit:
        description: "実現損益"
        required: false
        default: "0"
        type: string

      sbi_capital:
        description: "SBI短期売買の運用資金"
        required: false
        default: "0"
        type: string

      sbi_watchlist_json:
        description: "SBI監視銘柄データ"
        required: false
        default: "[]"
        type: string

      rakuten_capital:
        description: "楽天かぶミニの運用資金"
        required: false
        default: "30000"
        type: string

      rakuten_spread_rate:
        description: "片道スプレッド率（0.0022 = 0.22%）"
        required: false
        default: "0.0022"
        type: string


jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pythonライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas ta requests feedparser openai python-dotenv

      - name: Discordから指定された株を分析
        env:
          STOCK_CODE: ${{ inputs.stock_code }}
          DISCORD_CHANNEL_ID: ${{ inputs.channel_id }}
          MODE: ${{ inputs.mode }}
          PORTFOLIO_JSON: ${{ inputs.portfolio_json }}
          REALIZED_PROFIT: ${{ inputs.realized_profit }}
          SBI_CAPITAL: ${{ inputs.sbi_capital }}
          SBI_WATCHLIST_JSON: ${{ inputs.sbi_watchlist_json }}
          RAKUTEN_CAPITAL: ${{ inputs.rakuten_capital }}
          RAKUTEN_SPREAD_RATE: ${{ inputs.rakuten_spread_rate }}

          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        run: |
          python discord_action.py
