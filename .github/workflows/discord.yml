name: Discord Stock Analysis

on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: "分析する銘柄コード"
        required: true
        type: string

      channel_id:
        description: "結果を送るDiscordチャンネルID"
        required: true
        type: string

      mode:
        description: "analysis または ai_analysis"
        required: true
        default: "analysis"
        type: string


jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pythonライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas ta requests feedparser openai python-dotenv

      - name: Discordから指定された株を分析
        env:
          STOCK_CODE: ${{ inputs.stock_code }}
          DISCORD_CHANNEL_ID: ${{ inputs.channel_id }}
          MODE: ${{ inputs.mode }}

          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        run: |
          python discord_action.py