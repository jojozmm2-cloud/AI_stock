name: Rakuten Daily Shortlist

on:
  schedule:
    # 平日16:10 JST（東証終了後）。GitHub cronはUTC。
    - cron: "10 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要なライブラリを準備
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas ta requests feedparser openai python-dotenv

      - name: 楽天かぶミニ短期候補を判定
        env:
          MODE: rakuten_shortlist
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          RAKUTEN_CAPITAL: "30000"
          RAKUTEN_SPREAD_RATE: "0.0022"
        run: python discord_action.py
